      <stop offset="0%" stop-color="#86ff6b" />
      <stop offset="100%" stop-color="#1cb533" />
    </linearGradient>
    <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8c5433" />
