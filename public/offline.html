<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" href="/assets/pwa/icon-192.png" />
    <title>Offline · SPUDNAUT</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #05070d; color: #eef8ff; }
      body { box-sizing: border-box; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 480px); padding: 28px; border: 1px solid #536c93; border-radius: 16px; background: #10172a; text-align: center; }
      img { width: 96px; height: 96px; }
      h1 { margin: 12px 0; color: #9beeff; font-size: 1.4rem; }
      p { line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/pwa/icon-192.png" alt="" />
      <h1>Signal lost</h1>
      <p>Spudnaut could not load this page offline. Reconnect and try again; your saved progress stays on this device.</p>
    </main>
  </body>
</html>
