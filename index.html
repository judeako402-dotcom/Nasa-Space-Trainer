<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/loading/loading-poster.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070d'/%3E%3Crect x='14' y='24' width='12' height='24' rx='5' fill='%23b35a08' stroke='%230b0d10' stroke-width='2'/%3E%3Crect x='24' y='40' width='10' height='13' rx='4' fill='%23ef7d0d' stroke='%230b0d10' stroke-width='2'/%3E%3Crect x='40' y='40' width='10' height='13' rx='4' fill='%23ef7d0d' stroke='%230b0d10' stroke-width='2'/%3E%3Cpath d='M32 8c13 0 19 9 19 23v11c0 7-4 10-10 10H23c-6 0-10-3-10-10V31C13 17 19 8 32 8Z' fill='%23ef7d0d' stroke='%230b0d10' stroke-width='2'/%3E%3Cpath d='M35 22c8 0 12 4 12 10 0 5-5 8-12 8-5 0-9-2-11-5-1-2-1-5 2-8 2-3 5-5 9-5Z' fill='%23a8dbe8' stroke='%23e8fbff' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Spudnaut: The Great Starch Migration is a cooperative browser game. Complete a 30-day habitat trial and report your progress to Earth."
    />
    <title>SPUDNAUT: The Great Starch Migration</title>
    <style>
      .boot-loading {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 35%, #0e1d36 0%, #05070d 72%);
        color: #eef8ff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      .boot-loading-card {
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      .boot-loading-card img {
        width: clamp(132px, 24vw, 188px);
        height: auto;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.72));
      }
      .boot-loading-card strong {
        font-size: 13px;
        letter-spacing: 0.24em;
        color: #9beeff;
      }
      .boot-loading progress {
        width: min(220px, 68vw);
        height: 6px;
        accent-color: #9beeff;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading" role="status" aria-live="polite">
        <div class="boot-loading-card">
          <img src="/assets/loading/loading-poster.png" alt="" draggable="false" />
          <strong>SPUDNAUT</strong>
          <progress aria-label="Loading Spudnaut"></progress>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
