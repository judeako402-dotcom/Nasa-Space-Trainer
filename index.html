<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/pwa/apple-touch-icon.png" />
    <meta
      name="description"
      content="Spudnaut: The Great Starch Migration is a cooperative browser game. Complete a 30-day habitat trial and report your progress to Earth."
    />
    <title>SPUDNAUT: The Great Starch Migration</title>
    <style>
      .boot-loading {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 35%, #0e1d36 0%, #05070d 72%);
        color: #eef8ff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      .boot-loading-card {
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      .boot-loading-card img {
        width: clamp(132px, 24vw, 188px);
        height: auto;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.72));
      }
      .boot-loading-card strong {
        font-size: 13px;
        letter-spacing: 0.24em;
        color: #9beeff;
      }
      .boot-loading progress {
        width: min(220px, 68vw);
        height: 6px;
        accent-color: #9beeff;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading" role="status" aria-live="polite">
        <div class="boot-loading-card">
          <img src="/assets/loading/loading-poster.png" alt="" draggable="false" />
          <strong>SPUDNAUT</strong>
          <progress aria-label="Loading Spudnaut"></progress>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
